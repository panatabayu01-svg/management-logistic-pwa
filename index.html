<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="theme-color"
          content="#123f7a">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="default">

    <meta name="apple-mobile-web-app-title"
          content="Management Logistic">

    <meta name="application-name"
          content="Management Logistic">

    <!-- ICON PANATA -->
    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="./Panata_Icon_192.png?v=20260909">

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="./Panata_Icon_192.png?v=20260909">

    <!-- MANIFEST -->
    <link
        rel="manifest"
        href="./manifest.json?v=20260909">

    <title>Management Logistic</title>

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #ffffff;

            font-family:
                Arial,
                sans-serif;

        }

        #loading {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

        }

        #logo {

            width: 120px;
            height: 120px;

            object-fit: contain;

            margin-bottom: 20px;

        }

        h2 {

            margin: 0;

            color: #123f7a;

        }

        p {

            color: #666;

            margin-top: 10px;

        }

        #openApp {

            display: none;

            margin-top: 20px;

            padding: 14px 28px;

            border: 0;

            border-radius: 8px;

            background: #123f7a;

            color: white;

            font-size: 16px;

            font-weight: bold;

        }

    </style>

</head>


<body>

<div id="loading">

    <img
        id="logo"
        src="./Panata_Icon_192.png?v=20260909"
        alt="Panata">

    <h2>Management Logistic</h2>

    <p id="status">
        Membuka aplikasi...
    </p>

    <button id="openApp">
        BUKA MANAGEMENT LOGISTIC
    </button>

</div>


<script>

const APP_URL =
    "https://script.google.com/macros/s/AKfycbzAooaW16rMO6Xnp2J6IfHn25GUEh8AA0s0Q7UApuwCGa72dfRmYj2ZSL4PGOTEv9TqGw/exec";


/*
=========================================================
DETEKSI APLIKASI YANG SUDAH DIPASANG DI HOME SCREEN
=========================================================
*/

const isStandalone =
    window.navigator.standalone === true ||
    window.matchMedia(
        "(display-mode: standalone)"
    ).matches;


/*
=========================================================
JIKA DIBUKA DARI ICON HOME SCREEN
→ MASUK KE APPS SCRIPT
=========================================================
*/

if (isStandalone) {

    window.location.replace(APP_URL);

}


/*
=========================================================
JIKA DIBUKA DARI SAFARI
→ TETAP DI GITHUB
→ AGAR BISA ADD TO HOME SCREEN DENGAN ICON PANATA
=========================================================
*/

else {

    document.getElementById("status").textContent =
        "Tambahkan aplikasi ini ke Layar Utama untuk menggunakan Management Logistic.";

    const btn =
        document.getElementById("openApp");

    btn.style.display = "block";

    btn.onclick = function () {

        window.location.href = APP_URL;

    };

}

</script>

</body>

</html>
