<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#123f7a">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="default">

<meta name="apple-mobile-web-app-title"
      content="Management Logistic">

<meta name="application-name"
      content="Management Logistic">


<!--=========================================================
LOGO HOME SCREEN
=========================================================-->

<link rel="apple-touch-icon"
      sizes="180x180"
      href="./Panata_Icon_192.png">

<link rel="icon"
      type="image/png"
      sizes="192x192"
      href="./Panata_Icon_192.png">


<!--=========================================================
MANIFEST
=========================================================-->

<link rel="manifest"
      href="./manifest.json?v=20260914">


<title>Management Logistic</title>


<style>

html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    background: #fff;

    font-family: Arial, sans-serif;

}


#loading {

    width: 100%;

    min-height: 100%;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    box-sizing: border-box;

    padding: 20px;

}


#logo {

    width: 120px;

    height: 120px;

    object-fit: contain;

    display: block;

    margin-bottom: 20px;

}


h2 {

    margin: 0;

    color: #123f7a;

}


p {

    color: #666;

    margin-top: 10px;

    max-width: 340px;

    line-height: 1.4;

}


/*=========================================================
BUTTON
=========================================================*/

#openApp {

    display: none;

    margin-top: 20px;

    padding: 14px 28px;

    border: 0;

    border-radius: 8px;

    background: #123f7a;

    color: #fff;

    font-size: 16px;

    font-weight: bold;

    text-decoration: none;

    cursor: pointer;

    box-sizing: border-box;

}


#openApp:active {

    opacity: 0.85;

}

</style>

</head>


<body>


<div id="loading">


    <!--=====================================================
    LOGO TERTANAM LANGSUNG DI HTML
    ======================================================-->

    <img
        id="logo"
        src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA..."
        alt="Panata"
        width="120"
        height="120"
        draggable="false"
    >


    <h2>
        Management Logistic
    </h2>


    <p id="status">
        Membuka aplikasi...
    </p>


    <!--=====================================================
    TOMBOL BUKA
    ======================================================-->

    <a
        id="openApp"
        href="https://script.google.com/macros/s/AKfycbycR8eueJmxcDG-GDZ0THKKe1xftPC1Cp4FgTKyLiMKK4ZwM4fU6TDURzW6lBG8w8ouJQ/exec?utm_source=github"
        target="_blank"
        rel="noopener noreferrer"
    >
        BUKA MANAGEMENT LOGISTIC
    </a>


</div>


<script>


//=========================================================
// URL APPS SCRIPT
//=========================================================

const APP_URL =
    "https://script.google.com/macros/s/AKfycbycR8eueJmxcDG-GDZ0THKKe1xftPC1Cp4FgTKyLiMKK4ZwM4fU6TDURzW6lBG8w8ouJQ/exec?utm_source=github";


//=========================================================
// DETEKSI iOS
//=========================================================

const isIOS =
    /iPhone|iPad|iPod/i.test(
        navigator.userAgent
    );


//=========================================================
// DETEKSI PWA
//=========================================================

const isStandalone =
    isIOS
        ? window.navigator.standalone === true
        : window.matchMedia(
            "(display-mode: standalone)"
          ).matches;


//=========================================================
// ELEMENT
//=========================================================

const status =
    document.getElementById(
        "status"
    );

const btn =
    document.getElementById(
        "openApp"
    );


//=========================================================
// FUNGSI BUKA APLIKASI
//=========================================================

function bukaManagementLogistic(){

    /*
     * Gunakan URL lengkap dengan query.
     *
     * Ini lebih aman untuk browser,
     * GitHub Pages,
     * Android,
     * iPhone,
     * dan PWA.
     */

    window.open(
        APP_URL,
        "_blank",
        "noopener,noreferrer"
    );

}


//=========================================================
// JIKA SUDAH TERPASANG SEBAGAI APP
//=========================================================

if(isStandalone){

    if(status){

        status.textContent =
            "Membuka Management Logistic...";

    }


    /*
     * Jangan langsung menggunakan
     * window.location.replace().
     *
     * PWA tertentu dapat memblokir
     * perpindahan halaman tersebut.
     *
     * Kita tampilkan tombol sehingga
     * user dapat membuka aplikasi
     * secara normal.
     */

    if(btn){

        btn.style.display =
            "inline-block";

        btn.onclick =
            function(event){

                event.preventDefault();

                bukaManagementLogistic();

            };

    }

}


//=========================================================
// JIKA DIBUKA DARI BROWSER
//=========================================================

else{

    if(status){

        status.textContent =
            "Tambahkan aplikasi ini ke Layar Utama untuk menggunakan Management Logistic.";

    }


    if(btn){

        btn.style.display =
            "inline-block";


        /*
         * Anchor href tetap menjadi
         * fallback utama.
         */

        btn.onclick =
            function(){

                /*
                 * Jangan preventDefault.
                 *
                 * Browser akan membuka
                 * URL melalui target="_blank".
                 */

                return true;

            };

    }

}


</script>


</body>

</html>
